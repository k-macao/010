[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qp-hk-pipeline"
version = "0.1.0"
description = "港股量化财务数据：多源拉取 → 清洗流水线 → 规则/LLM 附注解析 → PIT 因子入库"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
sources = [
    "akshare>=1.16",
    "yfinance>=0.2.40",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
]
postgres = ["psycopg2-binary>=2.9"]
clickhouse = ["clickhouse-connect>=0.7"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]
all = [
    "akshare>=1.16", "yfinance>=0.2.40", "pymupdf>=1.24", "pdfplumber>=0.11",
    "psycopg2-binary>=2.9", "clickhouse-connect>=0.7",
    "pytest>=8", "pytest-cov>=5", "ruff>=0.5",
]

[project.scripts]
qp = "qp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qp = ["storage/sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
